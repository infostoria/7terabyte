<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>7 TeraByte – Școala Gimnazială Nr. 7 Buzău</title>
<meta name="description" content="7 TeraByte – jocuri de logică, siguranță online și Sala trofeelor pentru elevii Școlii Gimnaziale Nr. 7 Buzău">
<meta name="theme-color" content="#ffd3a3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="7 TeraByte">
<style>
  :root{
    --verde:#1f8a4c; --verde-inchis:#0f3d24; --verde-mediu:#14532d; --verde-deschis:#dff3e6;
    --portocaliu:#ff8a1f; --portocaliu-inchis:#d9660a; --galben:#ffd23f;
    --alb:#ffffff; --text:#13261b; --gri:#5d6b62; --rosu:#e04848;
    --umbra:0 6px 0 rgba(0,0,0,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{background:#0a2a19}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--text);min-height:100vh;
    background:radial-gradient(circle at 20% 0%,#1f6b40 0,#0f3d24 55%,#0a2a19 100%) fixed;
  }
  button{font:inherit;cursor:pointer}
  .app{max-width:560px;margin:0 auto;padding:16px 14px 40px}
  .sus{background:linear-gradient(180deg,#ffd3a3,#ffb470);border-radius:0 0 24px 24px;box-shadow:0 6px 0 rgba(0,0,0,.15);padding-top:env(safe-area-inset-top)}
  .sus-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px 14px;color:var(--verde-inchis)}
  .sus .titlu{font-weight:900;font-size:1.35rem;letter-spacing:.5px;line-height:1;min-width:0}
  .sus .titlu small{display:block;font-size:.68rem;font-weight:700;opacity:.8;letter-spacing:0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sus .scor{margin-left:auto;display:flex;gap:6px}
  #logo svg{display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
  .chip{background:rgba(255,255,255,.55);border:1px solid rgba(15,61,36,.18);color:var(--verde-inchis);border-radius:999px;padding:5px 10px;font-weight:800;font-size:.9rem;white-space:nowrap}
  .card{background:var(--alb);border-radius:20px;padding:18px;box-shadow:var(--umbra);margin-bottom:14px}
  h1,h2,h3{margin:0 0 8px;line-height:1.2}
  h2{font-size:1.35rem}
  p{margin:0 0 10px;line-height:1.45}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:1.02rem;color:#fff;background:var(--portocaliu);box-shadow:0 4px 0 var(--portocaliu-inchis);transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--portocaliu-inchis)}
  .btn.verde{background:var(--verde);box-shadow:0 4px 0 var(--verde-mediu)}
  .btn.gri{background:#e8eeea;color:var(--text);box-shadow:0 4px 0 #c9d3cc}
  .btn.lat{width:100%}
  .rand{display:flex;gap:10px;flex-wrap:wrap}
  .inapoi{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:8px 12px;font-weight:800;margin-bottom:12px}
  input[type=text]{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:2px solid #cfdcd3;margin:6px 0 12px}
  input[type=text]:focus{outline:none;border-color:var(--verde)}

  /* Harta nivelurilor */
  .salut{color:#fff;margin:2px 4px 12px}
  .salut h2{font-size:1.25rem}
  .bara{height:12px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:8px}
  .bara>i{display:block;height:100%;background:linear-gradient(90deg,var(--galben),var(--portocaliu));border-radius:999px}
  .harta{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .nivel{position:relative;text-align:left;border:0;border-radius:20px;padding:14px 14px 16px;background:var(--alb);box-shadow:var(--umbra);min-height:128px;display:flex;flex-direction:column;gap:4px;color:var(--text)}
  .nivel:active{transform:translateY(3px)}
  .nivel .nr{position:absolute;top:10px;right:12px;font-weight:900;font-size:.8rem;color:var(--gri)}
  .nivel .ic{font-size:2rem;line-height:1}
  .nivel b{font-size:1.02rem}
  .nivel span{font-size:.82rem;color:var(--gri);line-height:1.3}
  .nivel.gata{background:linear-gradient(160deg,#fff 60%,var(--verde-deschis))}
  .nivel.gata::after{content:"🏅";position:absolute;bottom:8px;right:10px;font-size:1.3rem}
  .nivel.mare{grid-column:1/-1;background:linear-gradient(135deg,#fff3cf,#ffd9a8);min-height:110px}
  .nivel.mare .ic{font-size:2.4rem}
  .subsol{color:rgba(255,255,255,.65);text-align:center;font-size:.8rem;margin-top:18px}

  /* Quiz */
  .progres{font-size:.85rem;color:var(--gri);font-weight:700;margin-bottom:6px}
  .optiuni{display:grid;gap:10px;margin-top:12px}
  .opt{border:2px solid #d6e2da;background:#f7faf8;border-radius:14px;padding:13px 14px;text-align:left;font-weight:700;font-size:1rem;color:var(--text)}
  .opt.corect{border-color:var(--verde);background:var(--verde-deschis)}
  .opt.gresit{border-color:var(--rosu);background:#fdeaea}
  .opt:disabled{cursor:default}
  .feedback{margin-top:12px;padding:12px 14px;border-radius:14px;background:#fff6e8;border:2px dashed var(--portocaliu);line-height:1.45}
  .scena{font-size:1.06rem;background:#f2f7f4;border-left:5px solid var(--verde);padding:12px 14px;border-radius:12px;margin:8px 0}
  .ghid-ic{font-size:3rem;text-align:center;margin:4px 0 8px}
  .puncte{display:flex;gap:6px;justify-content:center;margin:12px 0}
  .puncte i{width:10px;height:10px;border-radius:50%;background:#d6e2da}
  .puncte i.on{background:var(--portocaliu)}

  /* Găsește diferența */
  .dif-wrap{display:grid;gap:10px}
  .dif-wrap svg{width:100%;height:auto;border-radius:14px;border:3px solid #d6e2da;background:#fff;touch-action:manipulation}
  .dif-info{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin:6px 0 10px}

  /* Mahjong */
  .tabla{position:relative;margin:10px auto 6px}
  .piesa{position:absolute;border:0;padding:0;border-radius:9px;background:linear-gradient(160deg,#fffdf6,#f1e6c8);box-shadow:3px 4px 0 #b9a77a,0 0 0 1px #d8c79c inset;display:flex;align-items:center;justify-content:center;transition:transform .1s, opacity .2s}
  .piesa.blocata{filter:brightness(.82)}
  .piesa.sel{box-shadow:3px 4px 0 var(--portocaliu-inchis),0 0 0 3px var(--portocaliu) inset;transform:translateY(-3px)}
  .piesa.indiciu{box-shadow:3px 4px 0 var(--verde-mediu),0 0 0 3px var(--verde) inset}

  /* Memorie */
  .memorie{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
  .carte{aspect-ratio:3/4;border:0;border-radius:14px;font-size:2rem;background:linear-gradient(145deg,var(--verde),var(--verde-mediu));color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
  .carte .spate{font-weight:900;font-size:1.3rem;color:var(--portocaliu)}
  .carte.intoarsa,.carte.gasita{background:#fff;box-shadow:0 4px 0 #c9d3cc, 0 0 0 2px #d6e2da inset}
  .carte.gasita{opacity:.55}

  /* Trofee */
  .trofeu{padding:0;overflow:hidden}
  .trofeu img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#f2f7f4}
  .trofeu .corp{padding:14px 16px 16px}
  .trofeu .premiu{display:inline-block;background:var(--galben);color:#4a3600;font-weight:900;border-radius:999px;padding:4px 10px;font-size:.85rem;margin-bottom:8px}
  .trofeu .meta{color:var(--gri);font-size:.88rem;margin-bottom:12px}
  .reactie{border:2px solid #e3e9e5;background:#fff;border-radius:999px;padding:8px 14px;font-weight:900;font-size:1rem;color:var(--text)}
  .reactie.activ{border-color:var(--portocaliu);background:#fff3e6}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--verde-inchis);color:#fff;border:2px solid var(--galben);border-radius:16px;padding:12px 18px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .35s;z-index:50;text-align:center;max-width:90vw}
  .toast.vizibil{transform:translateX(-50%) translateY(0)}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
  .confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:cade 1.8s linear forwards}
  @keyframes cade{to{transform:translateY(110vh) rotate(540deg)}}
  @keyframes tremura{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .tremura{animation:tremura .25s 2}
</style>
</head>
<body>
<header class="sus">
  <div class="sus-in">
    <span id="logo"></span>
    <div class="titlu">7 TeraByte<small>Școala Nr. 7 Buzău</small></div>
    <div class="scor"><span class="chip" id="xp">⭐ 0</span><span class="chip" id="insigne">🏅 0/7</span></div>
  </div>
</header>
<div class="app">
  <main id="ecran"></main>
</div>
<div class="toast" id="toast"></div>

<script src="trofee.js"></script>
<script>
"use strict";
/* ---------- utilitare ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const amesteca = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const alege = a => a[Math.floor(Math.random() * a.length)];
const memorie = {
  citeste(k, implicit) { try { const v = localStorage.getItem("7tb_" + k); return v ? JSON.parse(v) : implicit; } catch (e) { return implicit; } },
  scrie(k, v) { try { localStorage.setItem("7tb_" + k, JSON.stringify(v)); } catch (e) {} }
};
let stare = memorie.citeste("stare", null) || { nume: "", insigne: {}, xp: 0, reactii: {} };
stare.insigne = stare.insigne || {}; stare.reactii = stare.reactii || {};
const salveaza = () => memorie.scrie("stare", stare);

function logo(marime, idUnic) {
  return `<svg width="${marime}" height="${marime}" viewBox="0 0 100 100" aria-label="Sigla 7 TeraByte"><defs><mask id="b${idUnic}"><rect width="100" height="100" fill="#fff"/><circle cx="82" cy="15" r="14" fill="#000"/><circle cx="96" cy="34" r="10" fill="#000"/></mask><clipPath id="c${idUnic}"><circle cx="50" cy="50" r="46"/></clipPath><radialGradient id="g${idUnic}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#5bb8f5"/><stop offset="1" stop-color="#1a5fa8"/></radialGradient></defs><g mask="url(#b${idUnic})"><circle cx="50" cy="50" r="46" fill="url(#g${idUnic})"/><g clip-path="url(#c${idUnic})" fill="#1f8a4c"><path d="M18 30C24 22 34 22 36 30C38 38 30 42 32 50C34 58 40 62 36 72C32 80 26 76 26 68C26 60 18 56 16 48C14 40 14 34 18 30Z"/><path d="M58 18C66 14 76 18 78 26C80 32 72 34 74 40C78 48 72 58 66 64C62 70 58 66 58 58C58 50 52 46 54 38C56 32 52 24 58 18Z"/><path d="M70 74C76 72 82 76 80 82C78 86 70 86 68 82C66 78 66 76 70 74Z"/></g><g clip-path="url(#c${idUnic})" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.2"><ellipse cx="50" cy="50" rx="20" ry="46"/><line x1="4" y1="50" x2="96" y2="50"/><ellipse cx="50" cy="50" rx="46" ry="18"/></g><ellipse cx="34" cy="26" rx="16" ry="9" fill="#fff" fill-opacity=".18" transform="rotate(-30 34 26)"/><circle cx="50" cy="50" r="45" fill="none" stroke="#0f3d24" stroke-opacity=".35" stroke-width="2"/></g><text x="48" y="74" text-anchor="middle" font-family="'Archivo Black','Arial Black',Arial,sans-serif" font-weight="900" font-size="66" fill="#ff8a1f" stroke="#fff" stroke-width="4" paint-order="stroke">7</text></svg>`;
}

function actualizeazaAntet() {
  $("#xp").textContent = "⭐ " + stare.xp;
  $("#insigne").textContent = "🏅 " + Object.keys(stare.insigne).length + "/7";
}
let toastTimer;
function toast(text) {
  const t = $("#toast"); t.innerHTML = text; t.classList.add("vizibil");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("vizibil"), 2600);
}
function confetti() {
  const c = document.createElement("div"); c.className = "confetti";
  const culori = ["#ff8a1f", "#ffd23f", "#1f8a4c", "#ffffff", "#7fd6a0"];
  for (let i = 0; i < 40; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "vw"; p.style.background = alege(culori);
    p.style.animationDelay = Math.random() * .6 + "s"; p.style.animationDuration = 1.4 + Math.random() + "s";
    c.appendChild(p);
  }
  document.body.appendChild(c); setTimeout(() => c.remove(), 3200);
}
function castiga(idNivel, puncte) {
  const nivel = NIVELURI.find(n => n.id === idNivel);
  stare.xp += puncte;
  const nou = !stare.insigne[idNivel];
  stare.insigne[idNivel] = true; salveaza(); actualizeazaAntet();
  if (nou) { confetti(); toast(`🏅 Insignă nouă: <b>${esc(nivel.insigna)}</b><br>+${puncte} ⭐`); }
  else toast(`Bravo! +${puncte} ⭐`);
}

/* ---------- navigare ---------- */
function arata(html) { const e = $("#ecran"); e.innerHTML = html; window.scrollTo(0, 0); return e; }
function butonInapoi() { return `<button class="inapoi" onclick="acasa()">← Harta</button>`; }

/* ---------- motorul de întrebări (niveluri 1, 2, 4) ---------- */
function joacaIntrebari(el, titlu, intrebari, laFinal) {
  let i = 0, corecte = 0;
  function pas() {
    const q = intrebari[i];
    const ordine = amesteca(q.v.map((t, k) => ({ t, k })));
    el.innerHTML = `<div class="card"><div class="progres">${esc(titlu)} · ${i + 1} din ${intrebari.length}</div>
      ${q.scena ? `<div class="scena">${esc(q.scena)}</div>` : ""}
      <h2>${esc(q.q)}</h2>
      <div class="optiuni">${ordine.map(o => `<button class="opt" data-k="${o.k}">${esc(o.t)}</button>`).join("")}</div>
      <div id="fb"></div></div>`;
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const k = Number(b.dataset.k), ok = k === q.c;
      if (ok) corecte++;
      el.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (Number(x.dataset.k) === q.c) x.classList.add("corect"); });
      if (!ok) { b.classList.add("gresit"); b.classList.add("tremura"); }
      el.querySelector("#fb").innerHTML = `<div class="feedback"><b>${ok ? "Corect! 🎉" : "Nu chiar…"}</b> ${esc(q.e)}</div>
        <div style="margin-top:12px"><button class="btn lat" id="urm">${i + 1 < intrebari.length ? "Mai departe →" : "Vezi rezultatul"}</button></div>`;
      el.querySelector("#urm").onclick = () => { i++; i < intrebari.length ? pas() : laFinal(corecte); };
    });
  }
  pas();
}
function ecranFinal(el, idNivel, corecte, total, prag, reia) {
  const trecut = corecte >= prag;
  el.innerHTML = `<div class="card" style="text-align:center">
    <div class="ghid-ic">${trecut ? "🏆" : "💪"}</div>
    <h2>${corecte} din ${total} corecte</h2>
    <p>${trecut ? "Excelent! Ai trecut nivelul." : `Mai încearcă! Ai nevoie de cel puțin ${prag} răspunsuri corecte pentru insignă.`}</p>
    <div class="rand" style="justify-content:center"><button class="btn gri" id="reia">Joacă din nou</button><button class="btn verde" onclick="acasa()">Înapoi la hartă</button></div></div>`;
  el.querySelector("#reia").onclick = reia;
  if (trecut) castiga(idNivel, corecte * 10); else if (corecte) { stare.xp += corecte * 2; salveaza(); actualizeazaAntet(); }
}

/* ---------- NIVELUL 1 – Baza de start ---------- */
const GHID = [
  { i: "🎒", t: "Bine ai venit în gimnaziu!", p: "În clasa a V-a ai câte un profesor pentru fiecare materie, iar orele pot fi în săli diferite. Uită-te dimineața pe orar, ca să știi unde mergi." },
  { i: "🧭", t: "Dirigintele tău", p: "Dirigintele are grijă de clasa ta. Când ai o problemă sau o întrebare despre școală, la el mergi prima dată." },
  { i: "📲", t: "Catalogul electronic Adservio", p: "Notele și absențele tale apar în Adservio. Părinții tăi au cont și pot urmări situația ta oricând." },
  { i: "💻", t: "Ora de TIC", p: "La TIC înveți să folosești calculatorul cu cap: să cauți informații corecte, să creezi documente și prezentări și să fii în siguranță pe internet." },
  { i: "👨‍👩‍👧", t: "Pentru părinți", p: "Urmăriți împreună cu copilul orarul și Adservio. Pentru orice nelămurire, primul pas este dirigintele clasei." }
];
const QUIZ_START = [
  { q: "Unde îți vezi notele și absențele?", v: ["În catalogul electronic Adservio", "Pe Facebook", "Nu le poate vedea nimeni"], c: 0, e: "Notele și absențele apar în Adservio, unde le văd și părinții tăi." },
  { q: "La cine mergi prima dată cu o problemă despre școală?", v: ["La diriginte", "La colegul de bancă", "Nu spun nimănui"], c: 0, e: "Dirigintele are grijă de clasa ta și te ajută să rezolvi problema." },
  { q: "Cum afli în ce sală ai următoarea oră?", v: ["Mă uit pe orar", "Ghicesc", "Aștept să mă caute cineva"], c: 0, e: "Orarul îți arată materia și sala pentru fiecare oră." }
];
function nivelStart(el) {
  let i = 0;
  function pagina() {
    const g = GHID[i];
    el.innerHTML = butonInapoi() + `<div class="card"><div class="progres">Baza de start · ${i + 1} din ${GHID.length}</div>
      <div class="ghid-ic">${g.i}</div><h2 style="text-align:center">${esc(g.t)}</h2><p style="text-align:center">${esc(g.p)}</p>
      <div class="puncte">${GHID.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
      <div class="rand">${i > 0 ? `<button class="btn gri" id="ant">← Înapoi</button>` : ""}
      <button class="btn" style="flex:1" id="urm">${i + 1 < GHID.length ? "Mai departe →" : "Misiunea finală 🎯"}</button></div></div>`;
    if (i > 0) el.querySelector("#ant").onclick = () => { i--; pagina(); };
    el.querySelector("#urm").onclick = () => { if (i + 1 < GHID.length) { i++; pagina(); } else quiz(); };
  }
  function quiz() {
    el.innerHTML = butonInapoi() + `<div id="q"></div>`;
    const q = el.querySelector("#q");
    joacaIntrebari(q, "Misiunea finală", QUIZ_START, c => ecranFinal(q, "start", c, QUIZ_START.length, 2, () => nivelStart(el)));
  }
  pagina();
}

/* ---------- NIVELUL 2 – Misiuni de detectiv digital ---------- */
const CAZURI = [
  { scena: "Primești un mesaj: „Felicitări! Ai câștigat un telefon nou. Apasă pe link și scrie parola contului tău.”", q: "Ce faci?", v: ["Nu apăs pe link și îi arăt mesajul unui adult", "Apăs repede, să nu pierd premiul", "Trimit linkul și prietenilor"], c: 0, e: "Este phishing: o capcană care vrea să-ți fure parola. Nimeni nu-ți dă premii în schimbul parolei." },
  { scena: "Îți faci cont într-un joc nou și trebuie să alegi o parolă.", q: "Care parolă este cea mai sigură?", v: ["Pisica-Verde!Zboara7", "123456", "Prenumele meu"], c: 0, e: "O parolă lungă, cu cuvinte, simboluri și cifre, e greu de ghicit. Și nu o spui nimănui, nici celui mai bun prieten." },
  { scena: "Cineva pe care nu-l cunoști îți scrie că are vârsta ta și îți cere poze și adresa școlii.", q: "Ce faci?", v: ["Nu răspund și le spun părinților sau unui profesor", "Îi trimit doar o poză", "Îi dau adresa, pare de treabă"], c: 0, e: "Pe internet nu știi sigur cine e de partea cealaltă. Datele și pozele tale rămân private." },
  { scena: "Pe grupul clasei, cineva trimite o poză urâtă cu un coleg și toți râd.", q: "Ce faci?", v: ["Nu o trimit mai departe și spun unui adult", "Dau și eu like", "O trimit și pe alt grup"], c: 0, e: "Asta e cyberbullying. Cine nu dă mai departe și cere ajutor îl apără pe colegul lui." },
  { scena: "Vezi un video în care un om celebru spune ceva foarte ciudat. Arată perfect real.", q: "Ce crezi?", v: ["Poate fi un deepfake, verific din surse sigure", "Sigur e adevărat, se vede clar", "Îl distribui imediat"], c: 0, e: "Cu inteligența artificială se pot face video-uri false care par reale. Verifică înainte să crezi sau să distribui." },

/* ---------- NIVELUL 5 – Construiește (Mahjong IT) ---------- */
const SIMBOLURI_MJ = ["💻", "🖱️", "⌨️", "🖥️", "💾", "📀", "🔋", "📡", "🤖", "🛰️", "📱", "🎮", "🔌", "🧠"];
const POZITII_MJ = (() => { const p = []; for (let y = 0; y < 4; y++) for (let x = 0; x < 6; x++) p.push({ x, y, z: 0 }); for (let y = 1; y < 3; y++) for (let x = 2; x < 4; x++) p.push({ x, y, z: 1 }); return p; })();
const cheie = p => p.x + "," + p.y + "," + p.z;
function esteLibera(p, lista) {
  const acoperita = lista.some(q => q.z > p.z && q.x === p.x && q.y === p.y);
  if (acoperita) return false;
  const stanga = lista.some(q => q.z === p.z && q.y === p.y && q.x === p.x - 1);
  const dreapta = lista.some(q => q.z === p.z && q.y === p.y && q.x === p.x + 1);
  return !(stanga && dreapta);
}
function genereazaMJ(pozitii, simboluri) {
  for (let t = 0; t < 300; t++) {
    let ramase = pozitii.slice(); const atribuire = {}; const s = amesteca(simboluri.slice()); let ok = true;
    while (ramase.length) {
      const libere = ramase.filter(p => esteLibera(p, ramase));
      if (libere.length < 2) { ok = false; break; }
      const a = alege(libere), b = alege(libere.filter(p => p !== a)), sim = s.pop();
      atribuire[cheie(a)] = sim; atribuire[cheie(b)] = sim;
      ramase = ramase.filter(p => p !== a && p !== b);
    }
    if (ok) return atribuire;
  }
  return null;
}
function nivelConstruieste(el) {
  let piese = POZITII_MJ.map(p => ({ ...p }));
  let atribuire = genereazaMJ(piese, SIMBOLURI_MJ);
  let selectata = null, indiciu = [];
  el.innerHTML = butonInapoi() + `<div class="card"><h2>Construiește: Mahjong IT 🧱</h2>
    <p>Potrivește perechile de piese identice. Poți lua doar piesele libere: fără nimic deasupra și libere măcar într-o parte.</p>
    <div class="dif-info"><span id="ram"></span><span class="rand" style="flex-wrap:nowrap"><button class="btn gri" id="ind" style="padding:8px 12px">💡</button><button class="btn gri" id="ames" style="padding:8px 12px;white-space:nowrap">🔀 Amestecă</button></span></div>
    <div class="tabla" id="tabla"></div><div id="mesaj"></div></div>`;
  const tabla = el.querySelector("#tabla");
  function deseneaza() {
    const latime = Math.min(tabla.parentElement.clientWidth - 36 - 12, 420);
    const tw = Math.floor(latime / 6.3), th = Math.floor(tw * 1.25);
    tabla.style.width = (tw * 6 + 8) + "px"; tabla.style.height = (th * 4 + 10) + "px";
    tabla.innerHTML = piese.map(p => {
      const k = cheie(p), libera = esteLibera(p, piese);
      const cls = ["piesa", libera ? "" : "blocata", selectata === k ? "sel" : "", indiciu.includes(k) ? "indiciu" : ""].join(" ");
      return `<button class="${cls}" data-k="${k}" style="left:${p.x * tw + 4 - p.z * 5}px;top:${p.y * th + 6 - p.z * 6}px;width:${tw - 4}px;height:${th - 4}px;z-index:${p.z * 100 + p.y * 10 + p.x};font-size:${Math.floor(tw * .52)}px">${atribuire[k]}</button>`;
    }).join("");
    el.querySelector("#ram").textContent = piese.length ? `${piese.length / 2} perechi rămase` : "Tablă curată!";
    tabla.querySelectorAll(".piesa").forEach(b => b.onclick = () => apasa(b.dataset.k, b));
  }
  function mutariPosibile() {
    const libere = piese.filter(p => esteLibera(p, piese));
    for (let i = 0; i < libere.length; i++) for (let j = i + 1; j < libere.length; j++)
      if (atribuire[cheie(libere[i])] === atribuire[cheie(libere[j])]) return [cheie(libere[i]), cheie(libere[j])];
    return null;
  }
  function apasa(k, b) {
    const p = piese.find(q => cheie(q) === k);
    if (!esteLibera(p, piese)) { b.classList.add("tremura"); setTimeout(() => b.classList.remove("tremura"), 500); return; }
    indiciu = [];
    if (selectata === null) selectata = k;
    else if (selectata === k) selectata = null;
    else if (atribuire[selectata] === atribuire[k]) {
      const s = selectata; piese = piese.filter(q => cheie(q) !== s && cheie(q) !== k); selectata = null;
      if (!piese.length) { deseneaza(); castiga("construieste", 60);
        el.querySelector("#mesaj").innerHTML = `<div class="feedback"><b>Constructor de nota 10! 🧱</b> Ai golit toată tabla.</div><div class="rand" style="margin-top:12px"><button class="btn gri" id="nou">Joc nou</button><button class="btn verde" onclick="acasa()">Înapoi la hartă</button></div>`;

    } else selectata = k;
    deseneaza();
  }
  el.querySelector("#ames").onclick = () => {
    const ramase = [...new Set(piese.map(p => atribuire[cheie(p)]))];
    const perechi = []; ramase.forEach(s => { const n = piese.filter(p => atribuire[cheie(p)] === s).length / 2; for (let i = 0; i < n; i++) perechi.push(s); });
    const noua = genereazaMJ(piese, perechi); if (noua) atribuire = noua;
    selectata = null; indiciu = []; el.querySelector("#mesaj").innerHTML = ""; deseneaza();
  };
  el.querySelector("#ind").onclick = () => { indiciu = mutariPosibile() || []; if (!indiciu.length) el.querySelector("#mesaj").innerHTML = `<div class="feedback">Nu mai sunt perechi libere. Apasă <b>🔀 Amestecă</b>!</div>`; deseneaza(); };
  deseneaza();
  window.onresize = () => { if (el.contains(tabla)) deseneaza(); };
}

function nivelMemorie(el) {
  const simb = ["🤖", "💾", "🖱️", "🛰️", "🧠", "🎮"];
  const carti = amesteca([...simb, ...simb].map((s, i) => ({ s, i })));
  const intoarse = [], gasite = new Set(); let mutari = 0, blocat = false;
  el.innerHTML = butonInapoi() + `<div class="card"><h2>Memorie vizuală 🧠</h2>
    <p>Întoarce câte două cărți și găsește toate perechile din cât mai puține mutări.</p>

    <div class="memorie" id="mem"></div><div id="mesaj"></div></div>`;
  const mem = el.querySelector("#mem");
  function deseneaza() {
    mem.innerHTML = carti.map((c, k) => {
      const vizibila = intoarse.includes(k) || gasite.has(c.s);
      return `<button class="carte ${gasite.has(c.s) ? "gasita" : vizibila ? "intoarsa" : ""}" data-k="${k}">${vizibila ? c.s : `<span class="spate">7</span>`}</button>`;

          el.querySelector("#nou").onclick = () => nivelMemorie(el);

    }

}

          <button class="reactie ${stare.reactii[t.id] && stare.reactii[t.id].inima ? "activ" : ""}" data-id="${esc(t.id)}" data-tip="inima">❤️ ${numar(t.id, "inima")}</button>
          <button class="reactie ${stare.reactii[t.id] && stare.reactii[t.id].stea ? "activ" : ""}" data-id="${esc(t.id)}" data-tip="stea">⭐ ${numar(t.id, "stea")}</button>
        </div></div></div>`).join("") : `<div class="card"><p>În curând aici vor apărea primele trofee!</p></div>`);
    el.querySelectorAll(".reactie").forEach(b => b.onclick = async () => {
      const id = b.dataset.id, tip = b.dataset.tip;
      stare.reactii[id] = stare.reactii[id] || {};
      const acum = !stare.reactii[id][tip]; stare.reactii[id][tip] = acum; salveaza();
      if (CONFIG.reactiiUrl && numaratori[id]) numaratori[id][tip] = Math.max(0, (numaratori[id][tip] || 0) + (acum ? 1 : -1));
      deseneaza();
      if (!stare.insigne.trofee) castiga("trofee", 15);
      await trimiteReactie(id, tip, acum ? 1 : -1); deseneaza();
    });
  }
  deseneaza();
  incarcaNumaratori().then(() => { if ($("#ecran").contains(el)) deseneaza(); });
}

/* ---------- ecranul principal ---------- */
let promptInstalare = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); promptInstalare = e; const b = $("#instaleaza"); if (b) b.style.display = ""; });

function acasa() {
  window.onresize = null;
  if (!stare.nume) {
    const el = arata(`<div class="card" style="text-align:center"><div style="margin:6px 0 10px">${logo(96, "mare")}</div>
      <h2>Bine ai venit în 7 TeraByte!</h2><p>Șapte niveluri de logică, atenție și siguranță online. Strângi steluțe și insigne la fiecare nivel.</p>
      <p style="text-align:left;margin-bottom:0"><b>Alege-ți o poreclă de jucător:</b></p>
      <input type="text" id="nume" maxlength="20" placeholder="de exemplu: Pixel, Ninja7, Byte" autocomplete="off">
      <p style="font-size:.82rem;color:var(--gri);text-align:left">Porecla rămâne doar pe telefonul tău. Nu scrie numele real.</p>
      <button class="btn lat" id="ok">Intră în joc 🚀</button></div>`);
    const go = () => { const v = el.querySelector("#nume").value.trim(); if (!v) { el.querySelector("#nume").focus(); return; } stare.nume = v.slice(0, 20); salveaza(); acasa(); };
    el.querySelector("#ok").onclick = go;
    el.querySelector("#nume").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    return;
  }
  const nrInsigne = Object.keys(stare.insigne).length;
  const el = arata(`<div class="salut"><h2>Salut, ${esc(stare.nume)}! 👋</h2>
      <div style="opacity:.85;font-size:.92rem">${nrInsigne === 7 ? "Ai toate cele 7 insigne. Ești un adevărat 7 TeraByte! 🏆" : `Ai ${nrInsigne} din 7 insigne. Alege un nivel!`}</div>
      <div class="bara"><i style="width:${Math.round(nrInsigne / 7 * 100)}%"></i></div></div>
    <div class="harta">${NIVELURI.map(n => `<button class="nivel ${n.nr === 7 ? "mare" : ""} ${stare.insigne[n.id] ? "gata" : ""}" data-id="${n.id}">
      <span class="nr">NIVELUL ${n.nr}</span><span class="ic">${n.ic}</span><b>${esc(n.nume)}</b><span>${esc(n.desc)}</span></button>`).join("")}</div>
    <div style="margin-top:16px;display:grid;gap:10px">
      <button class="btn verde lat" id="instaleaza" style="${promptInstalare ? "" : "display:none"}">📲 Instalează aplicația pe telefon</button>
      <button class="btn gri lat" id="profil">⚙️ Schimbă porecla</button></div>
    <div class="subsol">Școala Gimnazială Nr. 7 Buzău · Clubul 7 TeraByte</div>`);
  el.querySelectorAll(".nivel").forEach(b => b.onclick = () => {
    const n = NIVELURI.find(x => x.id === b.dataset.id);
    const ecran = arata(""); n.joc(ecran);
  });
  el.querySelector("#instaleaza").onclick = async () => { if (!promptInstalare) return; promptInstalare.prompt(); try { await promptInstalare.userChoice; } catch (e) {} promptInstalare = null; acasa(); };
  el.querySelector("#profil").onclick = () => { stare.nume = ""; salveaza(); acasa(); };
}
